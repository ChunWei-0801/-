name: Browser compatibility
on:
  push:
    branches: [main, 'recovery/**']
  pull_request:
permissions:
  contents: read
jobs:
  browsers:
    name: ${{ matrix.engine }} desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --prefix "$RUNNER_TEMP/fambudget-browser" playwright@1.57.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-fambudget-playwright-1.57.0-${{ matrix.engine }}
      - name: Use official Ubuntu mirrors with bounded network waits
        run: |
          sudo python3 - <<'PYSETUP'
          from pathlib import Path
          paths = list(Path('/etc/apt').glob('apt-mirrors*.txt'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          paths.append(Path('/etc/apt/sources.list'))
          for source in paths:
              if source.is_file():
                  text = source.read_text()
                  text = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  text = text.replace('http://archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  text = text.replace('http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu')
                  source.write_text(text)
          Path('/etc/apt/apt.conf.d/99-fambudget-ci-network').write_text('Acquire::Retries "1";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ForceIPv4 "true";\n')
          PYSETUP
      - name: Install browser and system dependencies
        timeout-minutes: 8
        run: '"$RUNNER_TEMP/fambudget-browser/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}'
      - name: Exercise actual app in desktop and mobile contexts
        env:
          FAMBUDGET_TEST_BROWSER: ${{ matrix.engine }}
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/fambudget-browser/node_modules/playwright"
          for profile in desktop mobile; do
            FAMBUDGET_TEST_DEVICE="$profile" node --test frontend/tests/payment-report-app-browser.cjs frontend/tests/smoking-inventory-browser.cjs || exit 1
          done

      - name: Save isolated layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-layout-${{ matrix.engine }}
          path: ${{ runner.temp }}/fambudget-${{ matrix.engine }}-*.png
          if-no-files-found: ignore
          retention-days: 14
