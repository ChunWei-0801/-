name: Application checks
on:
  push:
    branches: [main, 'recovery/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
        env:
          DATABASE_URL: 'sqlite://'
          JWT_SECRET: 'isolated-ci-test-secret-at-least-thirty-two-bytes'
          APP_ENV: development
      - run: node --test frontend/tests/api-mode.test.cjs
      - run: node --test frontend/tests/local-ai-engine.test.cjs frontend/tests/ai-assistant.test.cjs frontend/tests/ai-model-test.test.cjs
