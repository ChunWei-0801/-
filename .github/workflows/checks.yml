name: Application checks
on:
  push:
    branches: [main, 'recovery/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows-backup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell launcher and private file permissions
        shell: powershell
        run: .\tools\windows-backup\tests\Test-Launcher.ps1
      - name: Assemble standalone Windows backup tool
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'FamBudget-Windows-Backup'
          New-Item -ItemType Directory -Path $destination | Out-Null
          foreach ($name in @('Start-Backup.cmd', 'Start-Backup.ps1', 'windows_backup.py', 'Dockerfile', 'README.md')) {
            Copy-Item -LiteralPath (Join-Path 'tools/windows-backup' $name) -Destination $destination
          }
          Copy-Item -LiteralPath 'backend/tools/backup_restore.py' -Destination $destination
          $files = Get-ChildItem -LiteralPath $destination -File | ForEach-Object {
            @{name=$_.Name; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          @{sourceCommit=$env:GITHUB_SHA; files=@($files)} | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $destination 'package-integrity.json') -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: FamBudget-Windows-Backup
          path: ${{ runner.temp }}/FamBudget-Windows-Backup
          if-no-files-found: error
          retention-days: 30
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
        env:
          DATABASE_URL: 'sqlite://'
          JWT_SECRET: 'isolated-ci-test-secret-at-least-thirty-two-bytes'
          APP_ENV: development
      - run: node --test frontend/tests/api-mode.test.cjs frontend/tests/public-resource-api.test.cjs frontend/tests/nlp-lottery.test.cjs frontend/tests/app-install.test.cjs
      - run: node --test frontend/tests/local-ai-engine.test.cjs frontend/tests/local-ai-stability.test.cjs frontend/tests/local-ai-evaluation.test.cjs frontend/tests/currency-units.test.cjs frontend/tests/page-transitions.test.cjs frontend/tests/receipt-entry.test.cjs frontend/tests/assistant-report-query.test.cjs frontend/tests/ai-assistant.test.cjs frontend/tests/ai-model-test.test.cjs frontend/tests/ai-draft-replay.test.cjs frontend/tests/ai-bounded-replay.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --prefix "$RUNNER_TEMP/fambudget-browser" playwright@1.57.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-fambudget-playwright-1.57.0
      - run: '"$RUNNER_TEMP/fambudget-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/fambudget-browser/node_modules/playwright"
          node -e 'require(process.env.PLAYWRIGHT_MODULE)'
          node --test frontend/tests/ai-assistant.test.cjs frontend/tests/ai-model-test.test.cjs frontend/tests/ai-draft-replay.test.cjs frontend/tests/ai-bounded-replay.test.cjs frontend/tests/safety-center-browser.cjs frontend/tests/transaction-archive-browser.cjs frontend/tests/activity-ui-browser.cjs frontend/tests/direct-shortcuts-browser.cjs frontend/tests/dashboard-extras-browser.test.cjs frontend/tests/receipt-entry.test.cjs frontend/tests/savings-units-browser.test.cjs frontend/tests/voice-accessibility-browser.cjs frontend/tests/assistant-report-query.test.cjs
          node frontend/tests/lifestyle-modules-browser.cjs
