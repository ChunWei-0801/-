# Recovery creates separately named services; never repoint or delete the original failed environment.
# Render Blueprint：同源前後端 + PostgreSQL。
# 在自己的 Render 帳號選 ChunWei-0801/- 建立 Blueprint；保存檔案不等於部署。
# 服務名稱可能被其他使用者占用，可在建立前改名。前端不依賴固定子網域。
databases:
  - name: fambudget-recovery-db-20261017
    plan: free
    databaseName: fambudget
    user: fambudget

services:
  - type: web
    name: fambudget-recovery-20261017
    runtime: python
    branch: recovery/household-20261017
    autoDeployTrigger: "off"
    plan: free
    buildCommand: pip install -r backend/requirements.lock
    startCommand: cd backend && python -m alembic upgrade head && python -m app.cli init-db && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: APP_ENV
        value: production
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fambudget-recovery-db-20261017
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 正式驗證連結自動使用 Render 的 RENDER_EXTERNAL_URL；不需要預先猜網址。
      # 同源前端不需要跨域。另部署前端時才填該前端的完整 origin。
      - key: ALLOWED_ORIGINS
        value: ""
      # 模型未設定時前端明確標示規則備援，沒有微調模型或假資料。
      - key: MODEL_BASE_URL
        value: ""
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: 家庭記帳
